<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        padding: 155px 16px 125px;
        background: #060f1b;
        font-family:
          "Inter",
          "SF Pro Display",
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* A quiet electrical laboratory, with the activity in the foreground. */
      .electrical-background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        background:
          radial-gradient(ellipse at 8% 30%, #0c393e80, transparent 48%),
          radial-gradient(ellipse at 92% 72%, #15386470, transparent 48%),
          radial-gradient(ellipse at 50% 42%, #10253880, transparent 55%);
      }

      .electrical-background::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#7ccbd406 1px, transparent 1px),
          linear-gradient(90deg, #7ccbd406 1px, transparent 1px),
          linear-gradient(#7ccbd409 1px, transparent 1px),
          linear-gradient(90deg, #7ccbd409 1px, transparent 1px);
        background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
        mask-image: radial-gradient(ellipse, transparent 15%, #000 85%);
      }

      .electrical-background::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, #03091280);
      }

      .circuit-blueprint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #65d8cc;
        stroke-width: 1.4;
      }

      .mobile-circuit { display: none; }

      .circuit-wire {
        opacity: 0.32;
      }

      .circuit-detail {
        opacity: 0.14;
      }

      .circuit-label {
        fill: #9bb9c8;
        stroke: none;
        font: 12px "SFMono-Regular", Consolas, monospace;
        letter-spacing: 2px;
      }

      .circuit-symbol {
        fill: #8ddbd5;
        stroke: none;
        font: italic 20px Georgia, serif;
      }

      .current-trace {
        stroke: #9cfff0;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 3 42 3 340;
        filter: drop-shadow(0 0 5px #56e8d0);
        opacity: 0.75;
        animation: chargeFlow 18s linear infinite;
      }

      .characteristic-line {
        stroke: #71b9eb;
        stroke-width: 2;
        stroke-dasharray: 750;
        animation: lineReveal 7s ease-in-out infinite;
        filter: drop-shadow(0 0 5px #52a9e560);
      }

      .electrical-quantities {
        position: absolute;
        top: 8%;
        left: 7%;
        right: 7%;
        display: flex;
        justify-content: space-between;
        gap: 24px;
      }

      .quantity {
        min-width: 150px;
        padding-left: 18px;
        border-left: 1px solid #7fd6d438;
        color: #82a0b1;
      }

      .quantity-label {
        display: block;
        font-size: 11px;
        letter-spacing: 3px;
        margin-bottom: 12px;
      }

      .quantity-value {
        color: #b1d3dd;
        font: 300 clamp(26px, 2.8vw, 42px) "SFMono-Regular", Consolas, monospace;
        letter-spacing: -1px;
      }

      .quantity-value em {
        color: #74d7cb;
        font-family: Georgia, serif;
        margin-right: 10px;
      }

      .quantity-value small {
        color: #698b9f;
        font-size: 0.45em;
        margin-left: 8px;
        letter-spacing: 1px;
      }

      .physics-symbols {
        position: absolute;
        inset: 0;
      }

      .physics-symbol {
        position: absolute;
        left: var(--x);
        top: var(--y);
        color: var(--color, #91d3d0);
        font: italic 400 var(--size, 56px) Georgia, "Times New Roman", serif;
        line-height: 1;
        opacity: var(--opacity, 0.3);
        text-shadow: 0 0 28px #61d5cc22;
        animation: symbolDrift var(--duration, 8s) ease-in-out infinite;
        animation-delay: var(--delay, 0s);
      }

      @keyframes symbolDrift {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(-6deg);
          opacity: var(--opacity, 0.3);
        }
        50% {
          transform: translate3d(
            calc(var(--sway, 18px) * var(--motion-scale, 1)),
            calc(var(--lift, -30px) * var(--motion-scale, 1)),
            0
          ) rotate(6deg);
          opacity: calc(var(--opacity, 0.3) + 0.1);
        }
      }

      @keyframes chargeFlow {
        to { stroke-dashoffset: -776; }
      }

      @keyframes lineReveal {
        0%, 100% { stroke-dashoffset: 750; opacity: 0; }
        15% { opacity: 0.65; }
        65%, 85% { stroke-dashoffset: 0; opacity: 0.65; }
      }

      @media (max-width: 700px) {
        .electrical-quantities {
          top: 6%;
          left: 5%;
          right: 5%;
          gap: 12px;
        }
        .quantity { min-width: 0; padding-left: 10px; }
        .quantity-label { font-size: 9px; letter-spacing: 1px; }
        .quantity-value { font-size: 22px; }
        .quantity-value em { margin-right: 4px; }
        .quantity-value small { margin-left: 3px; }
        .circuit-blueprint { display: none; }
        .mobile-circuit {
          display: block;
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          fill: none;
          stroke: #65d8cc;
          stroke-width: 1;
          opacity: 0.22;
        }
        .mobile-circuit .current-trace { opacity: 0.6; }
        .btn { padding: 16px 44px; font-size: 1rem; }
        .physics-symbol {
          left: var(--mobile-x, var(--x));
          top: var(--mobile-y, var(--y));
          font-size: clamp(20px, calc(var(--size, 56px) * 0.65), 48px);
          --motion-scale: 0.6;
        }
        .physics-symbol:nth-child(n + 9) { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .electrical-background * { animation: none; }
        .characteristic-line { stroke-dashoffset: 0; opacity: 0.5; }
      }

      .container {
        text-align: center;
        position: relative;
        z-index: 10;
      }

      /* 3D Cylinder Container */
      .cylinder-container {
        --cylinder-depth: clamp(90px, 18vw, 240px);
        width: min(500px, calc(100vw - 32px));
        aspect-ratio: 1;
        perspective: 1500px;
        margin: 0 auto 20px;
        position: relative;
      }

      .cylinder {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: cylinderIdle 8s linear infinite;
      }

      .cylinder.spinning {
        animation: cylinderSpin 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      }

      @keyframes cylinderIdle {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }

      @keyframes cylinderSpin {
        0% {
          transform: rotateY(0deg) rotateX(10deg);
        }
        20% {
          transform: rotateY(180deg) rotateX(-5deg);
        }
        40% {
          transform: rotateY(360deg) rotateX(10deg);
        }
        60% {
          transform: rotateY(540deg) rotateX(-5deg);
        }
        80% {
          transform: rotateY(720deg) rotateX(10deg);
        }
        100% {
          transform: rotateY(900deg) rotateX(0deg);
        }
      }

      /* Name cards on cylinder */
      .cylinder-card {
        position: absolute;
        width: 84%;
        height: 36%;
        left: 50%;
        top: 50%;
        margin-left: -42%;
        margin-top: -18%;
        background: linear-gradient(
          145deg,
          rgba(79, 195, 247, 0.9),
          rgba(41, 182, 246, 0.9)
        );
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.8rem, 7vw, 3.5rem);
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        box-shadow:
          0 0 40px rgba(79, 195, 247, 0.4),
          inset 0 0 30px rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backface-visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .cylinder-card.visible {
        opacity: 1;
      }

      .cylinder-card.selected {
        background: linear-gradient(145deg, #f59e0b, #ef4444);
        box-shadow:
          0 0 60px rgba(245, 158, 11, 0.6),
          0 0 100px rgba(239, 68, 68, 0.4),
          inset 0 0 30px rgba(255, 255, 255, 0.2);
        animation: cardSelected 0.6s ease-out;
      }

      @keyframes cardSelected {
        0% {
          transform: scale(0.5) rotateY(0deg);
        }
        50% {
          transform: scale(1.2) rotateY(180deg);
        }
        100% {
          transform: scale(1) rotateY(360deg);
        }
      }

      .cylinder-card:nth-child(1) {
        transform: rotateY(0deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(2) {
        transform: rotateY(36deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(3) {
        transform: rotateY(72deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(4) {
        transform: rotateY(108deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(5) {
        transform: rotateY(144deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(6) {
        transform: rotateY(180deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(7) {
        transform: rotateY(216deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(8) {
        transform: rotateY(252deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(9) {
        transform: rotateY(288deg) translateZ(var(--cylinder-depth));
      }
      .cylinder-card:nth-child(10) {
        transform: rotateY(324deg) translateZ(var(--cylinder-depth));
      }

      /* Central display card */
      .display-card {
        position: absolute;
        width: 90%;
        height: 40%;
        left: 50%;
        top: 50%;
        margin-left: -45%;
        margin-top: -20%;
        background: rgba(15, 15, 25, 0.95);
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(2rem, 7vw, 4rem);
        font-weight: 800;
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 25px 80px rgba(0, 0, 0, 0.5),
          inset 0 0 60px rgba(99, 102, 241, 0.05);
        backdrop-filter: blur(20px);
        z-index: 100;
        overflow: hidden;
      }

      .display-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent 40%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 60%
        );
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) rotate(45deg);
        }
      }

      .display-card.reveal {
        animation: cardReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes cardReveal {
        0% {
          transform: scale(0.3) rotateX(90deg);
          opacity: 0;
          filter: blur(20px);
        }
        50% {
          filter: blur(0);
        }
        100% {
          transform: scale(1) rotateX(0deg);
          opacity: 1;
        }
      }

      .btn {
        padding: 18px 60px;
        font-size: 1.2rem;
        border: none;
        border-radius: 60px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 700;
        position: relative;
        overflow: hidden;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .btn:hover::before {
        left: 100%;
      }

      .btn-primary {
        background: linear-gradient(135deg, #4fc3f7, #29b6f6, #03a9f4);
        background-size: 200% 200%;
        color: #fff;
        box-shadow:
          0 10px 40px rgba(79, 195, 247, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        animation: gradientShift 3s ease infinite;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .btn-primary:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow:
          0 20px 60px rgba(79, 195, 247, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      }

      .btn-primary:active {
        transform: translateY(-2px) scale(1.02);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      @media (max-height: 600px) {
        body { padding: 90px 16px 55px; }
        .cylinder-container {
          width: min(340px, calc(100vw - 32px), calc(100svh - 205px));
          --cylinder-depth: clamp(55px, 20vh, 120px);
          margin-bottom: 8px;
        }
        .display-card { font-size: clamp(1rem, 5vh, 2.4rem); }
        .cylinder-card { font-size: clamp(1rem, 4vh, 2rem); }
        .btn { padding: 12px 40px; font-size: 1rem; }
        .electrical-quantities { top: 5%; }
        .quantity-label { margin-bottom: 6px; }
        .quantity-value { font-size: 24px; }
        .physics-symbol { font-size: clamp(16px, calc(var(--size, 56px) * 0.45), 32px); }
      }

      /* Confetti particles */
      .confetti {
        position: fixed;
        width: 12px;
        height: 12px;
        pointer-events: none;
        z-index: 1000;
      }

      /* Firework burst */
      .firework {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div class="electrical-background" aria-hidden="true">
      <svg class="circuit-blueprint" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
          <path id="circuit-path" d="M100 422V330H192 M268 330H380V590H100V438" />
          <pattern id="graph-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" stroke="#7ebed1" stroke-opacity="0.12" stroke-width="1" />
          </pattern>
        </defs>

        <!-- Closed DC circuit: 12 V across 24 ohms gives 0.5 A. -->
        <g class="circuit-wire">
          <use href="#circuit-path" />
          <path d="M192 318H268V342H192Z M80 422H120 M88 438H112" />
          <path d="M192 330V257H215 M245 257H268V330" />
          <circle cx="230" cy="257" r="15" />
          <path d="M135 366H173L166 361 M173 366L166 371" />
          <circle cx="192" cy="330" r="3" fill="#65d8cc" />
          <circle cx="268" cy="330" r="3" fill="#65d8cc" />
          <text x="223" y="264" class="circuit-symbol">V</text>
          <text x="204" y="305" class="circuit-label">R = 24 Ω</text>
          <text x="132" y="405" class="circuit-symbol">I</text>
          <text x="61" y="413" class="circuit-symbol">+</text>
          <text x="64" y="458" class="circuit-symbol">−</text>
          <text x="126" y="467" class="circuit-label">U = 12 V</text>
          <text x="100" y="639" class="circuit-label">01 / DIRECT CURRENT</text>
          <text x="100" y="666" class="circuit-symbol">I</text>
        </g>
        <use href="#circuit-path" class="current-trace" />

        <!-- Junior-school Ohm law graph: voltage is proportional to current. -->
        <g transform="translate(1210 290)">
          <rect y="20" width="300" height="240" fill="url(#graph-grid)" stroke="#71b9eb" stroke-opacity="0.12" />
          <g class="circuit-wire" stroke="#71b9eb">
            <path d="M0 260H310L303 256 M310 260L303 264 M0 270V6L-4 13 M0 6L4 13" />
            <text x="-5" y="-12" class="circuit-symbol">U</text>
            <text x="316" y="266" class="circuit-symbol">I</text>
            <text x="0" y="310" class="circuit-label">02 / VOLTAGE &amp; CURRENT</text>
            <text x="0" y="340" class="circuit-symbol">U</text>
          </g>
          <path class="characteristic-line" d="M0 260L270 44" />
        </g>

        <!-- Faint traces and component symbols frame the central stage. -->
        <g class="circuit-detail">
          <path d="M0 180H340L410 250H505 M0 740H280L350 810H520 M1600 190H1320L1250 120H1140 M1600 770H1330L1260 840H1090" />
          <circle cx="505" cy="250" r="5" />
          <circle cx="520" cy="810" r="5" />
          <circle cx="1140" cy="120" r="5" />
          <circle cx="1090" cy="840" r="5" />
          <path d="M140 825H195 M231 825H285 M200 812L226 838 M200 838L226 812 M1320 745H1370 M1370 733H1420V757H1370Z M1420 745H1490" />
          <circle cx="213" cy="825" r="18" />
          <text x="140" y="878" class="circuit-symbol">W</text>
          <text x="1320" y="799" class="circuit-symbol">P</text>
        </g>
      </svg>

      <svg class="mobile-circuit" viewBox="0 0 390 844" preserveAspectRatio="none">
        <path d="M0 174H56L80 150H122 M168 150H258L282 174H390 M122 143H168V157H122Z" />
        <path d="M0 690H48L72 714H122 M160 714H230L254 690H390 M122 706H160V722H122Z" />
        <path d="M20 225V285 M20 530V625L44 649H80 M370 225V285 M370 530V625L346 649H310" />
        <circle cx="20" cy="225" r="3" />
        <circle cx="370" cy="225" r="3" />
        <circle cx="80" cy="649" r="3" />
        <circle cx="310" cy="649" r="3" />
        <path class="current-trace" d="M0 174H56L80 150H122 M168 150H258L282 174H390" />
      </svg>

      <div class="electrical-quantities">
        <div class="quantity">
          <span class="quantity-label">电压 / VOLTAGE</span>
          <span class="quantity-value"><em>U</em>12<small>V</small></span>
        </div>
        <div class="quantity">
          <span class="quantity-label">电流 / CURRENT</span>
          <span class="quantity-value"><em>I</em>0.5<small>A</small></span>
        </div>
        <div class="quantity">
          <span class="quantity-label">电阻 / RESISTANCE</span>
          <span class="quantity-value"><em>R</em>24<small>Ω</small></span>
        </div>
      </div>
      <div class="physics-symbols">
        <span class="physics-symbol" style="--x: 7%; --y: 21%; --mobile-x: 10%; --mobile-y: 24%; --size: 76px; --duration: 5.5s; --sway: 22px; --lift: -34px; --delay: -8s">U</span>
        <span class="physics-symbol" style="--x: 88%; --y: 23%; --mobile-x: 82%; --mobile-y: 27%; --size: 40px; --duration: 8s; --sway: -18px; --lift: -26px; --delay: -12s; --color: #9bbfe2">I</span>
        <span class="physics-symbol" style="--x: 6%; --y: 70%; --mobile-x: 8%; --mobile-y: 61%; --size: 62px; --duration: 6.5s; --sway: 28px; --lift: -42px; --delay: -4s">R</span>
        <span class="physics-symbol" style="--x: 90%; --y: 61%; --mobile-x: 84%; --mobile-y: 62%; --size: 52px; --duration: 9s; --sway: -24px; --lift: -30px; --delay: -16s; --color: #9bbfe2">U</span>
        <span class="physics-symbol" style="--x: 17%; --y: 86%; --mobile-x: 17%; --mobile-y: 84%; --size: 32px; --duration: 5s; --sway: 16px; --lift: -24px; --delay: -6s">I</span>
        <span class="physics-symbol" style="--x: 79%; --y: 86%; --mobile-x: 75%; --mobile-y: 86%; --size: 70px; --duration: 10.5s; --sway: -20px; --lift: -38px; --delay: -18s">R</span>
        <span class="physics-symbol" style="--x: 33%; --y: 22%; --mobile-x: 46%; --mobile-y: 20%; --size: 34px; --duration: 7s; --sway: 14px; --lift: -28px; --delay: -11s; --opacity: 0.2">t</span>
        <span class="physics-symbol" style="--x: 62%; --y: 91%; --mobile-x: 45%; --mobile-y: 91%; --size: 48px; --duration: 6s; --sway: -17px; --lift: -32px; --delay: -3s; --opacity: 0.22">P</span>
        <span class="physics-symbol" style="--x: 20%; --y: 47%; --size: 30px; --duration: 11s; --sway: -26px; --lift: -26px; --delay: -14s; --opacity: 0.18">I</span>
        <span class="physics-symbol" style="--x: 76%; --y: 45%; --size: 58px; --duration: 7.5s; --sway: 20px; --lift: -36px; --delay: -5s; --opacity: 0.2">R</span>
        <span class="physics-symbol" style="--x: 62%; --y: 21%; --size: 44px; --duration: 9.5s; --sway: -18px; --lift: -30px; --delay: -19s; --opacity: 0.22; --color: #9bbfe2">U</span>
        <span class="physics-symbol" style="--x: 35%; --y: 86%; --size: 64px; --duration: 6.8s; --sway: 24px; --lift: -40px; --delay: -9s; --opacity: 0.25">R</span>
        <span class="physics-symbol" style="--x: 48%; --y: 91%; --size: 38px; --duration: 8.5s; --sway: -14px; --lift: -24px; --delay: -20s; --opacity: 0.22; --color: #9bbfe2">U</span>
        <span class="physics-symbol" style="--x: 92%; --y: 78%; --size: 46px; --duration: 5.8s; --sway: 18px; --lift: -34px; --delay: -7s; --opacity: 0.18">W</span>
      </div>
    </div>

    <div class="container">
      <div class="cylinder-container">
        <div class="cylinder" id="cylinder">
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
          <div class="cylinder-card"><span></span></div>
        </div>
        <div class="display-card" id="displayCard">等待点名...</div>
      </div>

      <button class="btn btn-primary" id="pickBtn">随机点名</button>
    </div>

    <script>
      // Student names - embedded directly
      const STUDENTS = [
        "刘筱妍",
        "庞博文",
        "李宇涵",
        "肖鑫浩",
        "刘嫣祺",
        "刘辉",
        "程纪豪",
        "张宸烨",
        "杨淑媛",
        "肖丹",
        "黄帅",
        "伍昱涛",
        "李任军",
        "廖泽宇",
        "陈悠悠",
        "李依灿",
        "陈柏睿",
        "钱卓远",
        "罗子俊",
        "谭伊淇",
        "肖兆",
        "肖湘尹",
        "曾姝妍",
        "周子茹",
        "马瑾怡",
        "彭碧涵",
        "邹涛宇",
        "刘权",
        "邓婕敏",
        "肖子豪",
        "刘子睿",
        "邹叶蓉",
        "岳敏薇",
        "刘釨锐",
        "阮颂哲",
        "邱辰晟",
        "袁振焜",
        "陈智明",
        "范梓涵",
        "刘艺馨",
        "伍赞运",
        "易思彤",
        "罗予彤",
        "刘辰恩",
        "丁雨涵",
        "王馨",
        "黄紫婕",
        "曾金玉",
        "张良东",
        "范毅",
        "周利来",
        "罗米辰",
        "黄雪瑶",
        "谭雅",
      ];

      let students = [];
      let remainingStudents = [];
      let isSpinning = false;

      const cylinder = document.getElementById("cylinder");
      const displayCard = document.getElementById("displayCard");
      const pickBtn = document.getElementById("pickBtn");
      const cylinderCards = cylinder.querySelectorAll(".cylinder-card");

      function init() {
        students = STUDENTS;
        remainingStudents = [...students];
        updateCylinderNames();
        cylinderCards.forEach((card) => {
          card.querySelector("span").textContent = "???";
          card.classList.add("visible");
        });
      }

      function updateCylinderNames() {
        const displayNames =
          remainingStudents.length >= 10
            ? remainingStudents.slice(0, 10)
            : [
                ...remainingStudents,
                ...Array(10 - remainingStudents.length).fill("???"),
              ];
        cylinderCards.forEach((card, i) => {
          card.querySelector("span").textContent = displayNames[i] || "???";
        });
      }

      function createConfetti(x, y) {
        const colors = [
          "#4fc3f7",
          "#29b6f6",
          "#03a9f4",
          "#f59e0b",
          "#10b981",
          "#3b82f6",
        ];
        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.style.left = x + "px";
          confetti.style.top = y + "px";
          confetti.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
          const angle = Math.random() * Math.PI * 2;
          const velocity = 10 + Math.random() * 20;
          const vx = Math.cos(angle) * velocity;
          const vy = Math.sin(angle) * velocity - 10;
          document.body.appendChild(confetti);
          let posX = x,
            posY = y,
            opacity = 1,
            rotation = 0;
          const gravity = 0.5;
          let vyLocal = vy;
          const animate = () => {
            posX += vx;
            vyLocal += gravity;
            posY += vyLocal;
            opacity -= 0.02;
            rotation += 10;
            confetti.style.left = posX + "px";
            confetti.style.top = posY + "px";
            confetti.style.opacity = opacity;
            confetti.style.transform = `rotate(${rotation}deg)`;
            if (opacity > 0) {
              requestAnimationFrame(animate);
            } else {
              confetti.remove();
            }
          };
          requestAnimationFrame(animate);
        }
      }

      function createFirework(x, y) {
        const colors = ["#fff", "#4fc3f7", "#a5b4fc", "#fcd34d", "#6ee7b7"];
        for (let i = 0; i < 30; i++) {
          const particle = document.createElement("div");
          particle.className = "firework";
          particle.style.left = x + "px";
          particle.style.top = y + "px";
          particle.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
          const angle = (i / 30) * Math.PI * 2;
          const velocity = 5 + Math.random() * 10;
          const vx = Math.cos(angle) * velocity;
          const vy = Math.sin(angle) * velocity;
          document.body.appendChild(particle);
          let posX = x,
            posY = y,
            opacity = 1;
          const animate = () => {
            posX += vx;
            posY += vy;
            opacity -= 0.03;
            particle.style.left = posX + "px";
            particle.style.top = posY + "px";
            particle.style.opacity = opacity;
            if (opacity > 0) {
              requestAnimationFrame(animate);
            } else {
              particle.remove();
            }
          };
          requestAnimationFrame(animate);
        }
      }

      pickBtn.addEventListener("click", () => {
        if (remainingStudents.length === 0 || isSpinning) return;
        isSpinning = true;
        pickBtn.disabled = true;
        pickBtn.textContent = "点名中...";
        displayCard.textContent = "???";
        displayCard.style.background = "rgba(15, 15, 25, 0.95)";
        cylinder.classList.add("spinning");
        const spinInterval = setInterval(() => {
          const randomNames = [...students]
            .sort(() => Math.random() - 0.5)
            .slice(0, 10);
          cylinderCards.forEach((card, i) => {
            card.querySelector("span").textContent = randomNames[i] || "???";
          });
        }, 100);
        setTimeout(() => {
          clearInterval(spinInterval);
          cylinder.classList.remove("spinning");
          const selectedIndex = Math.floor(
            Math.random() * remainingStudents.length,
          );
          const selected = remainingStudents.splice(selectedIndex, 1)[0];
          displayCard.classList.remove("reveal");
          void displayCard.offsetWidth;
          displayCard.classList.add("reveal");
          displayCard.textContent = selected;
          displayCard.style.background =
            "linear-gradient(135deg, rgba(79, 195, 247, 0.9), rgba(41, 182, 246, 0.9))";
          const rect = displayCard.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          createConfetti(centerX, centerY);
          setTimeout(() => createFirework(centerX, centerY), 200);
          setTimeout(() => createFirework(centerX - 100, centerY - 50), 400);
          setTimeout(() => createFirework(centerX + 100, centerY - 50), 600);
          updateCylinderNames();
          pickBtn.textContent = "随机点名";
          pickBtn.disabled = remainingStudents.length === 0;
          isSpinning = false;
          if (remainingStudents.length === 0) {
            displayCard.textContent = "点名完成！";
          }
        }, 1500);
      });

      init();
    </script>
  </body>
</html>
